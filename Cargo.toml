[workspace]
members = ["crates/core", "crates/native", "crates/wasm"]
default-members = ["crates/native"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
duckdb-neo = { path = "/Users/okruitho/duckdb-rs.prepare-2.0.1/crates/duckdb-neo", features = [
    "build-extension",
] }
# duckdb-neo = { version = "=0.20001.0", features = ["build-extension"] }
rusty_quack_core = { path = "crates/core" }

[profile.release]
lto = true
strip = true
