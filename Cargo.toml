[workspace]
members = ["crates/core", "crates/native", "crates/wasm"]
default-members = ["crates/native"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
duckdb-neo = { version = "0.20000.0", features = ["build-extension"] }
duckdb-loadable-macros = { version = "1.20000.0", features = ["neo"] }
rusty_quack_core = { path = "crates/core" }

[profile.release]
lto = true
strip = true
